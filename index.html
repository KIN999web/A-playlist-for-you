<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Кофейный плеер ☕🎵</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            font-family: -apple-system, 'Segoe UI', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            touch-action: manipulation;
            position: relative;
            overflow-x: hidden;
            transition: background 1.2s ease, background-image 1.2s ease;
            background: #120c0a;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #f5e6d3, #c49a6c);
            animation: twinkle 3s infinite alternate;
            box-shadow: 0 0 12px rgba(196, 154, 108, 0.3);
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1.3); }
        }

        .card {
            position: relative;
            z-index: 10;
            max-width: 420px;
            width: 100%;
            background: rgba(255, 245, 235, 0.06);
            backdrop-filter: blur(24px) saturate(1.2);
            -webkit-backdrop-filter: blur(24px) saturate(1.2);
            border: 1px solid rgba(196, 154, 108, 0.15);
            border-radius: 56px;
            padding: 36px 28px 32px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(196, 154, 108, 0.05);
            color: #f5ede7;
            text-align: center;
        }
        .card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            border-radius: 58px;
            background: linear-gradient(135deg, #c49a6c33, #8b6b4d22, #f5e6d311);
            z-index: -1;
            filter: blur(8px);
        }

        .avatar-icon {
            font-size: 3.8rem;
            display: block;
            margin-bottom: 4px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 0 20px rgba(196, 154, 108, 0.3));
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f5e6d3, #c49a6c, #f5e6d3);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            margin-bottom: 2px;
        }
        .sub {
            font-size: 0.85rem;
            opacity: 0.4;
            letter-spacing: 4px;
            margin-bottom: 20px;
            font-weight: 300;
            color: #c49a6c;
        }

        .photo-ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            margin: 0 auto 14px;
            overflow: hidden;
            border: 3px solid rgba(196, 154, 108, 0.4);
            box-shadow: 0 0 40px rgba(196, 154, 108, 0.2);
            animation: pulsePhoto 2.5s ease-in-out infinite;
            transition: opacity 0.6s ease;
        }
        .photo-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @keyframes pulsePhoto {
            0% { transform: scale(1); box-shadow: 0 0 40px rgba(196, 154, 108, 0.2); }
            50% { transform: scale(1.04); box-shadow: 0 0 70px rgba(196, 154, 108, 0.35); }
            100% { transform: scale(1); box-shadow: 0 0 40px rgba(196, 154, 108, 0.2); }
        }.player-wrap {
            background: rgba(255, 245, 235, 0.03);
            border-radius: 40px;
            padding: 16px 16px 14px;
            border: 1px solid rgba(196, 154, 108, 0.08);
            margin-bottom: 18px;
        }
        .track-name {
            font-size: 1.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #f5e6d3, #c49a6c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .track-artist {
            font-size: 0.75rem;
            opacity: 0.4;
            margin-top: 2px;
            color: #c49a6c;
        }

        .player-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 12px;
        }
        .player-btn {
            background: none;
            border: none;
            color: #f5ede7;
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.5;
            touch-action: manipulation;
            padding: 0 10px;
        }
        .player-btn:active {
            transform: scale(0.85);
            opacity: 0.9;
        }
        .player-btn.big {
            font-size: 2.6rem;
            opacity: 0.8;
        }

        .progress-wrap {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .progress-bar {
            flex: 1;
            height: 4px;
            border-radius: 4px;
            background: rgba(255,255,255,0.1);
            cursor: pointer;
            position: relative;
            touch-action: none;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 4px;
            background: linear-gradient(90deg, #c49a6c, #f5e6d3);
            transition: width 0.1s linear;
        }
        .time-label {
            font-size: 0.7rem;
            opacity: 0.3;
            min-width: 36px;
            font-variant-numeric: tabular-nums;
        }

        .compliment-btn {
            background: linear-gradient(135deg, #c49a6c, #8b6b4d);
            border: none;
            padding: 14px 20px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.0rem;
            color: #120c0a;
            cursor: pointer;
            transition: all 0.25s;
            box-shadow: 0 8px 30px rgba(196, 154, 108, 0.25);
            width: 100%;
            letter-spacing: 1px;
            touch-action: manipulation;
            border: 1px solid rgba(255, 245, 235, 0.08);
            margin-top: 4px;
        }
        .compliment-btn:active {
            transform: scale(0.96);
            box-shadow: 0 4px 20px rgba(196, 154, 108, 0.4);
        }

        .compliment-box {
            margin-top: 18px;
            min-height: 54px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 6px 4px;
            border-radius: 30px;
            background: rgba(255, 245, 235, 0.02);
            border: 1px dashed rgba(196, 154, 108, 0.08);
        }
        .compliment-box span {
            background: rgba(255, 245, 235, 0.05);
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 0.9rem;
            border: 1px solid rgba(196, 154, 108, 0.06);
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: #f5ede7;
        }
        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .footer {
            margin-top: 20px;
            font-size: 0.6rem;
            opacity: 0.12;
            letter-spacing: 2px;
            color: #c49a6c;
        }.track-counter {
            font-size: 0.65rem;
            opacity: 0.2;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        @media (max-width: 450px) {
            .card { padding: 28px 18px 26px; border-radius: 40px; }
            h1 { font-size: 2rem; }
            .photo-ring { width: 100px; height: 100px; }
        }
    </style>
</head>
<body>

<div class="stars" id="starsContainer"></div>

<div class="card">
    <span class="avatar-icon">☕🌙</span>
    <h1>для тебя</h1>
    <div class="sub">кофейный плейлист</div>

    <div class="photo-ring">
        <img src="photo1.jpg" alt="Фото" id="userPhoto">
    </div>

    <div class="player-wrap">
        <div class="track-name" id="trackName">Talk To Me</div>
        <div class="track-artist" id="trackArtist">Molly Santana</div>

        <div class="player-controls">
            <button class="player-btn" id="prevBtn">⏮️</button>
            <button class="player-btn big" id="playBtn">▶️</button>
            <button class="player-btn" id="nextBtn">⏭️</button>
        </div>

        <div class="progress-wrap">
            <span class="time-label" id="currentTime">0:00</span>
            <div class="progress-bar" id="progressBar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time-label" id="totalTime">0:00</span>
        </div>

        <div class="track-counter" id="trackCounter">1 / 4</div>
    </div>

    <button class="compliment-btn" id="surpriseBtn">✨ нажми, если я крутая ✨</button>

    <div class="compliment-box" id="complimentBox">
        <span>☕ жду твоего клика</span>
    </div>

    <div class="footer">сделано с теплом · для твоего iPhone</div>
</div>

<script>
    (function() {
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 1.5;
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = (Math.random() * 5) + 's';
            star.style.animationDuration = (Math.random() * 3 + 2) + 's';
            star.style.opacity = Math.random() * 0.6 + 0.3;
            starsContainer.appendChild(star);
        }

        const playlist = [
            {
                name: 'Talk To Me',
                artist: 'Molly Santana',
                file: 'track1.mp3',
                photo: 'photo1.jpg',
                bg: 'radial-gradient(ellipse at 20% 30%, #2a1a12 0%, #120c0a 70%), radial-gradient(ellipse at 80% 70%, #1f140e 0%, transparent 60%)'
            },
            {
                name: 'Название трека 2',
                artist: 'Исполнитель 2',
                file: 'track2.mp3',
                photo: 'photo2.jpg',
                bg: 'radial-gradient(ellipse at 30% 20%, #1a0a2e 0%, #0d0517 70%), radial-gradient(ellipse at 70% 80%, #2d1b3d 0%, transparent 50%)'
            },
            {
                name: 'Название трека 3',
                artist: 'Исполнитель 3',
                file: 'track3.mp3',
                photo: 'photo3.jpg',
                bg: 'radial-gradient(ellipse at 40% 30%, #0a1a2e 0%, #050d17 70%), radial-gradient(ellipse at 60% 70%, #1b2d3d 0%, transparent 50%)'
            },
            {
                name: 'Название трека 4',
                artist: 'Исполнитель 4',
                file: 'track4.mp3',
                photo: 'photo4.jpg',
                bg: 'radial-gradient(ellipse at 50% 30%, #2a1a0a 0%, #120c05 70%), radial-gradient(ellipse at 50% 70%, #3d2d1b 0%, transparent 50%)'
            }
        ];

        let currentIndex = 0;
        let isPlaying = false;
        let audio = new Audio();const trackName = document.getElementById('trackName');
        const trackArtist = document.getElementById('trackArtist');
        const trackCounter = document.getElementById('trackCounter');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const progressFill = document.getElementById('progressFill');
        const progressBar = document.getElementById('progressBar');
        const currentTimeLabel = document.getElementById('currentTime');
        const totalTimeLabel = document.getElementById('totalTime');
        const userPhoto = document.getElementById('userPhoto');

        function loadTrack(index) {
            const track = playlist[index];
            if (!track) return;

            audio.pause();
            audio = new Audio(track.file);
            audio.loop = false;
            audio.volume = 0.8;

            trackName.textContent = track.name;
            trackArtist.textContent = track.artist;
            trackCounter.textContent = ${index + 1} / ${playlist.length};

            userPhoto.style.opacity = '0';
            setTimeout(() => {
                userPhoto.src = track.photo;
                userPhoto.onerror = function() {
                    this.src = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><circle cx="100" cy="100" r="100" fill="%23c49a6c33"/><text x="50" y="110" font-size="40" fill="%23c49a6c">☕</text></svg>';
                };
                userPhoto.style.opacity = '1';
            }, 300);

            document.body.style.background = track.bg;
            document.body.style.backgroundImage = track.bg;

            progressFill.style.width = '0%';
            currentTimeLabel.textContent = '0:00';
            totalTimeLabel.textContent = '0:00';

            isPlaying = false;
            playBtn.textContent = '▶️';

            audio.addEventListener('loadedmetadata', function() {
                totalTimeLabel.textContent = formatTime(audio.duration);
            });

            audio.addEventListener('timeupdate', function() {
                if (audio.duration) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    progressFill.style.width = percent + '%';
                    currentTimeLabel.textContent = formatTime(audio.currentTime);
                }
            });

            audio.addEventListener('ended', function() {
                nextTrack();
            });
        }

        function playTrack() {
            audio.play().catch(() => {});
            isPlaying = true;
            playBtn.textContent = '⏸️';
        }

        function pauseTrack() {
            audio.pause();
            isPlaying = false;
            playBtn.textContent = '▶️';
        }

        function togglePlay() {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) {
                playTrack();
            }
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentIndex);
            if (isPlaying) {
                playTrack();
            }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return mins + ':' + (secs < 10 ? '0' : '') + secs;
        }

        progressBar.addEventListener('click', function(e) {
            const rect = this.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            audio.currentTime = x * audio.duration;
        });progressBar.addEventListener('touchstart', function(e) {
            const rect = this.getBoundingClientRect();
            const touch = e.touches[0];
            const x = (touch.clientX - rect.left) / rect.width;
            audio.currentTime = x * audio.duration;
        }, { passive: true });

        playBtn.addEventListener('click', function(e) {
            e.preventDefault();
            togglePlay();
        });
        playBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            togglePlay();
        }, { passive: false });

        prevBtn.addEventListener('click', function(e) {
            e.preventDefault();
            prevTrack();
        });
        prevBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            prevTrack();
        }, { passive: false });

        nextBtn.addEventListener('click', function(e) {
            e.preventDefault();
            nextTrack();
        });
        nextBtn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            nextTrack();
        }, { passive: false });

        const complimentBtn = document.getElementById('surpriseBtn');
        const box = document.getElementById('complimentBox');

        const messages = [
            '☕ ты — мой кофе утром',
            '🌙 твоя улыбка — как звёзды',
            '🔥 ты согреваешь как латте',
            '✨ твоя энергия — космос',
            '💫 с тобой время летит',
            '🌸 ты — нежность в чашке',
            '🧠 твой ум — ванильный раф',
            '💅 твой стиль — чёрный бриллиант',
            '🌊 ты — океан спокойствия',
            '💖 просто кофейное совершенство'
        ];

        function getRandom(arr, count = 3) {
            const copy = [...arr];
            const result = [];
            for (let i = 0; i < count; i++) {
                const idx = Math.floor(Math.random() * copy.length);
                result.push(copy.splice(idx, 1)[0]);
            }
            return result;
        }

        complimentBtn.addEventListener('click', function(e) {
            e.preventDefault();
            const picks = getRandom(messages, 3);
            box.innerHTML = picks.map(text => <span>${text}</span>).join('');
        });
        complimentBtn.addEventListener('touchstart', function(e) {}, { passive: true });

        loadTrack(0);
    })();
</script>
</body>
</html>
